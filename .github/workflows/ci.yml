name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Check names are now "test (ubuntu-latest)" and "test (macos-latest)".
  # Update any branch protection required checks that still name "test".
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Unit tests (includes typecheck + lint via pretest)
        run: npm test
      - name: E2E tests
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Consumer typecheck (dist/*.d.ts)
        run: npm run typecheck:consumer
      - name: Pack smoke
        run: npm run pack:smoke
      - name: Install smoke
        run: npm run install:smoke
