name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Check names are now "test (ubuntu-latest)" and "test (macos-latest)".
  # Update any branch protection required checks that still name "test".
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Unit tests (includes typecheck + lint via pretest)
        run: npm test
      # CI=true adds vitest.failureReporter.mjs (see vitest.e2e.config.mjs): each failure is printed and
      # annotated as it happens. The exit reason is printed too, so a run killed before vitest's summary says so.
      - name: E2E tests
        shell: bash
        run: |
          set +e
          npx vitest run --config vitest.e2e.config.mjs
          status=$?
          if [ "$status" -gt 128 ]; then
            echo "::error title=E2E tests::vitest was killed by signal $((status - 128)) (SIG$(kill -l $((status - 128)))) before it finished"
          else
            echo "vitest exited with status $status"
          fi
          exit "$status"
      - name: Build
        run: npm run build
      - name: Consumer typecheck (dist/*.d.ts)
        run: npm run typecheck:consumer
      - name: Pack smoke
        run: npm run pack:smoke
      - name: Install smoke
        run: npm run install:smoke
